name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python tools/validate_repo.py
      - name: Build site
        run: python tools/build_site.py --output site

